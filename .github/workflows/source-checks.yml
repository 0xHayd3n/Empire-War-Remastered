name: Source checks

on:
  push:
    branches: [nightly, remastered]
  pull_request:
    branches: [nightly, remastered]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check engine, physics, maps and production build without retail data
        run: npm run check:nightly
